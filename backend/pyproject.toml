[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-work-manager"
version = "0.1.0"
description = "Phase 1 vertical slice for a personal AI work management system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
jarvis-db = "app.sqlite_maintenance:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["app*"]
